server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location = /ready {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
