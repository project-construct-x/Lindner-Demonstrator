services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./backend
        target: /backend
      - backend-data:/data
    environment:
      - DATA_DIR=/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Docker.dev
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ./frontend
        target: /frontend

volumes:
  backend-data:
