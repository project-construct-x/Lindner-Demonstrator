services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
      - backend-data:/data
    environment:
      - DATA_DIR=/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Docker.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - VITE_BACKEND_BASE_URL=http://localhost:8080/api

volumes:
  backend-data:
